<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Impresión de Pasaportes - 8 por Hoja Carta (7x9 cm)</title>
  <!-- Librería SheetJS para leer Excel/CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    /* ==========================================
       ESTILOS PARA PANTALLA / PANEL DE CONTROL
       ========================================== */
    @media screen {
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f1f5f9;
        margin: 0;
        padding: 20px;
        color: #334155;
      }
      .panel-control {
        max-width: 650px;
        margin: 0 auto 30px auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      }
      h2 {
        margin-top: 0;
        color: #1e3a8a;
      }
      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input[type="text"], input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
      }
      .btn {
        border: none;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        transition: background 0.2s;
      }
      .btn-primary {
        background-color: #1e3a8a;
        color: white;
      }
      .btn-primary:hover {
        background-color: #1d4ed8;
      }
      .btn-success {
        background-color: #059669;
        color: white;
        margin-top: 10px;
      }
      .btn-success:hover {
        background-color: #10b981;
      }
      .preview-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
    }

    /* ==========================================
       ESTILOS GENERALES Y MAQUETACIÓN PÁGINA CARTA
       ========================================== */
    * {
      box-sizing: border-box;
    }

    /* Tamaño Carta Horizontal: 27.94 cm x 21.59 cm */
    .sheet-page {
      width: 27.94cm;
      height: 21.59cm;
      padding: 1.2cm 1cm;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      margin-bottom: 20px;
      page-break-after: always;
      display: grid;
      grid-template-columns: repeat(4, 6.5cm); /* 4 columnas de 6.5 cm */
      grid-template-rows: repeat(2, 9cm);       /* 2 filas de 9 cm */
      gap: 0.2cm 0.4cm;                          /* Espaciado para guías de corte */
      justify-content: center;
      align-content: center;
    }

    /* Estructura individual de cada Pasaporte (7 cm x 9 cm) */
    .passport-card {
      width: 6.5cm;  /* Ajustado ligeramente para margen seguro dentro de la grilla de 4 */
      height: 9cm;
      padding: 0.25cm;
      border: 1px dashed #cbd5e1; /* Línea de guía para recorte */
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 0.7cm;
    }

    .event-title {
      font-size: 8pt;
      font-weight: bold;
      color: #1e3a8a;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .seat-badge {
      background-color: #1e3a8a;
      color: #ffffff;
      font-size: 10pt;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 4px;
      text-align: center;
      min-width: 1.1cm;
    }

    .photo-box {
      width: 5.8cm;
      height: 5.4cm;
      margin: 0.1cm 0;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background-color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* Foto completa sin recortar ni deformar */
    }

    .participant-name {
      text-align: center;
      font-size: 8.5pt;
      font-weight: bold;
      color: #0f172a;
      text-transform: uppercase;
      line-height: 1.15;
      width: 100%;
    }

    /* ==========================================
       ESTILOS EXCLUSIVOS PARA IMPRESIÓN (PDF)
       ========================================== */
    @page {
      size: letter landscape; /* Hoja Carta Horizontal */
      margin: 0;
    }

    @media print {
      .panel-control {
        display: none !important;
      }
      body {
        background: transparent;
        margin: 0;
        padding: 0;
      }
      .sheet-page {
        box-shadow: none;
        margin: 0;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>

  <!-- Panel de Control -->
  <div class="panel-control">
    <h2>Generador de Pasaportes (8 por Hoja Carta)</h2>
    
    <div class="form-group">
      <label for="titleInput">Título del Evento:</label>
      <input type="text" id="titleInput" value="CITA CON DIOS">
    </div>

    <div class="form-group">
      <label for="csvFileInput">Cargar Archivo de Datos (CSV o Excel):</label>
      <input type="file" id="csvFileInput" accept=".csv, .xlsx, .xls">
    </div>

    <button class="btn btn-primary" onclick="procesarDatos()">1. Generar Hoja con Pasaportes</button>
    <button class="btn btn-success" onclick="window.print()">2. Imprimir / Descargar en PDF</button>
  </div>

  <!-- Vista previa e impresión de Hojas Carta -->
  <div class="preview-container" id="sheetsContainer"></div>

  <script>
    function procesarDatos() {
      const fileInput = document.getElementById('csvFileInput');
      const eventTitle = document.getElementById('titleInput').value.trim() || 'CITA CON DIOS';
      const container = document.getElementById('sheetsContainer');

      if (!fileInput.files.length) {
        alert('Por favor, selecciona un archivo de datos (Excel o CSV).');
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        let jsonRows = XLSX.utils.sheet_to_json(worksheet);

        // 1. Ordenar datos alfabéticamente por columna SILLA
        jsonRows.sort((a, b) => {
          const sillaA = (a.SILLA || a.Silla || '').toString().toUpperCase();
          const sillaB = (b.SILLA || b.Silla || '').toString().toUpperCase();
          return sillaA.localeCompare(sillaB, undefined, {numeric: true, sensitivity: 'base'});
        });

        container.innerHTML = '';
        let currentSheet = null;

        // 2. Agrupar en hojas Carta (máximo 8 pasaportes por hoja)
        jsonRows.forEach((row, index) => {
          if (index % 8 === 0) {
            currentSheet = document.createElement('div');
            currentSheet.className = 'sheet-page';
            container.appendChild(currentSheet);
          }

          const silla = row.SILLA || row.Silla || '';
          const pNombre = row['Primer nombre'] || row.Primer_nombre || '';
          const sNombre = row['Segundo nombre'] || row.Segundo_nombre || '';
          const pApellido = row['Primer Apellido'] || row.Primer_Apellido || '';
          const sApellido = row['Segundo Apellido'] || row.Segundo_apellido || '';
          const fotoUrl = row.Foto || row.foto || '';

          const nombreCompleto = `${pNombre} ${sNombre} ${pApellido} ${sApellido}`.replace(/\s+/g, ' ').trim();

          const cardHtml = `
            <div class="passport-card">
              <div class="top-header">
                <div class="event-title">${eventTitle}</div>
                <div class="seat-badge">${silla}</div>
              </div>
              <div class="photo-box">
                <img src="${fotoUrl}" alt="Foto de ${nombreCompleto}" onerror="this.src='https://via.placeholder.com/150?text=Sin+Foto'">
              </div>
              <div class="participant-name">${nombreCompleto}</div>
            </div>
          `;
          currentSheet.innerHTML += cardHtml;
        });

        alert(`¡Se crearon ${Math.ceil(jsonRows.length / 8)} hoja(s) Carta con un total de ${jsonRows.length} pasaportes! Haz clic en 'Imprimir / Descargar en PDF'.`);
      };

      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
